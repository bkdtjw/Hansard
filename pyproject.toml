[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orch"
version = "0.0.0"
description = "异构多智能体编排系统（orchestrator-spec.md 的实现）"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
orch = "orch.cli.main:main"

[project.optional-dependencies]
cli = ["typer>=0.12"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
